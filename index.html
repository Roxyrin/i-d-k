<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Mini App</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Привет, Mini App!</h1>
    <p id="user-greeting">Загрузка данных пользователя...</p>
    <button onclick="sendData()">Нажми на меня</button>

    <script>
        // Инициализация Mini App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем имя пользователя, если оно доступно
        let user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-greeting').innerText = `Привет, ${user.first_name || 'друг'}!`;
        } else {
            document.getElementById('user-greeting').innerText = 'Привет, гость!';
        }

        function sendData() {
            // Отправляем данные обратно боту или закрываем приложение
            tg.showAlert('Вы нажали кнопку в Mini App!');
        }
    </script>
</body>
</html>
